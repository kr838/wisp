<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wisp</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body>
    <div class="card">
      <header class="head" data-tauri-drag-region>
        <div class="title">
          <span id="name">处理</span>
          <span class="model" id="model"></span>
          <span class="think-badge" id="think-badge"></span>
        </div>
        <div class="win-btns">
          <button class="wb" id="btn-close" title="关闭">&#10005;</button>
        </div>
      </header>

      <!-- Both panels start collapsed: the answer is the content people came for. -->
      <details class="fold" id="think-wrap" hidden>
        <summary>
          <span class="fold-label">思考过程</span>
          <span class="fold-state" id="think-state"></span>
        </summary>
        <div class="fold-body" id="think"></div>
      </details>

      <details class="fold" id="src-wrap">
        <summary>
          <span class="fold-label">原文</span>
          <span class="fold-state" id="src-hint"></span>
        </summary>
        <div class="fold-body" id="src"></div>
      </details>

      <!-- Conversation: the first turn is the action's answer, later turns are follow-ups. -->
      <section class="thread" id="thread">
        <div class="empty" id="empty">正在处理…</div>
      </section>

      <footer class="foot">
        <div class="ask">
          <textarea id="ask-input" rows="1" placeholder="追问…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="btn accent" id="btn-ask" title="发送">发送</button>
        </div>
        <div class="foot-row">
          <button class="btn" id="btn-stop">停止</button>
          <button class="btn" id="btn-retry">重试</button>
          <span class="foot-gap"></span>
          <button class="btn" id="btn-copy">复制结果</button>
        </div>
      </footer>
    </div>
    <script src="marked.umd.js"></script>
    <script src="action.js"></script>
  </body>
</html>
