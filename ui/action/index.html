<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wisp</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body>
    <div class="card">
      <!-- One header line, fully used: action name, then the model and thinking level in the
           space that was previously empty. The extra metadata costs no additional height. -->
      <!-- `data-tauri-drag-region="deep"` makes the whole subtree draggable. The bare
           attribute only reacts to clicks on the header element itself, which left just the
           header's own padding as a hit area — a few pixels at the very top of the window.
           Buttons opt out with data-tauri-drag-region="false" so they stay clickable. -->
      <header class="head" data-tauri-drag-region="deep">
        <span class="name" id="name">处理</span>
        <span class="meta">
          <span class="model" id="model"></span>
          <span class="think-badge" id="think-badge" hidden></span>
        </span>
        <span class="win-btns">
          <button class="wb" id="btn-min" title="最小化" aria-label="最小化" data-tauri-drag-region="false">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 5.5h6" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          </button>
          <button class="wb" id="btn-max" title="最大化" aria-label="最大化" data-tauri-drag-region="false">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          </button>
          <button class="wb wb-close" id="btn-close" title="关闭" aria-label="关闭" data-tauri-drag-region="false">
            <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          </button>
        </span>
      </header>

      <!-- Both folds are single thin bars and start collapsed. -->
      <details class="fold" id="think-wrap" hidden>
        <summary>
          <span class="fold-label">思考过程</span>
          <span class="fold-state" id="think-state"></span>
        </summary>
        <div class="fold-body" id="think"></div>
      </details>

      <details class="fold" id="src-wrap">
        <summary>
          <span class="fold-label">原文</span>
          <span class="fold-state" id="src-hint"></span>
        </summary>
        <div class="fold-body" id="src"></div>
      </details>

      <!-- The answer thread is the whole point: it gets all remaining height. -->
      <section class="thread" id="thread">
        <div class="empty" id="empty">正在处理…</div>
      </section>

      <!-- One row only: the input plus a single button that is 发送 or 停止 depending on
           state. 重试 appears only after a failure, where it is actually useful. -->
      <footer class="foot">
        <textarea id="ask-input" rows="1" placeholder="追问…"></textarea>
        <button class="btn" id="btn-retry" hidden>重试</button>
        <button class="btn accent" id="btn-stop" hidden>停止</button>
        <button class="btn accent" id="btn-ask">发送</button>
      </footer>
    </div>
    <script src="marked.umd.js"></script>
    <script src="action.js"></script>
  </body>
</html>
