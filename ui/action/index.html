<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wisp</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body>
    <div class="card">
      <header class="head" data-tauri-drag-region>
        <div class="title">
          <span id="name">处理</span>
          <span class="model" id="model"></span>
          <span class="think-badge" id="think-badge"></span>
        </div>
        <div class="win-btns">
          <button class="wb" id="btn-close" title="关闭">&#10005;</button>
        </div>
      </header>

      <details class="think" id="think-wrap" hidden>
        <summary>
          <span class="think-label">思考过程</span>
          <span class="think-state" id="think-state"></span>
        </summary>
        <div class="think-text" id="think"></div>
      </details>

      <section class="src">
        <div class="src-label">原文</div>
        <div class="src-text" id="src"></div>
      </section>

      <section class="out" id="out-wrap">
        <div class="out-text" id="out"></div>
        <div class="empty" id="empty">正在处理…</div>
      </section>

      <footer class="foot">
        <button class="btn" id="btn-stop">停止</button>
        <button class="btn" id="btn-retry">重试</button>
        <span class="foot-gap"></span>
        <button class="btn" id="btn-copy">复制结果</button>
        <button class="btn accent" id="btn-settings">设置</button>
      </footer>
    </div>
    <script src="action.js"></script>
  </body>
</html>
