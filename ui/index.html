<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wisp · 设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <!-- No custom titlebar: this window keeps the native Windows frame, which already
         provides minimise / maximise / close. Drawing our own on top duplicated them. -->
    <div class="shell">
      <nav class="side">
        <button class="nav" data-tab="general">通用</button>
        <button class="nav" data-tab="actions">动作</button>
        <button class="nav" data-tab="models">模型</button>
        <button class="nav" data-tab="about">关于</button>
      </nav>
      <main class="content" id="content"></main>
    </div>
    <!-- Save feedback is transient: edits auto-save, and a "已保存" toast appears briefly.
         No permanent bar (it occupied space for no reason) and no dedicated save button —
         Enter or leaving the window commits immediately. -->
    <div class="toast" id="toast"></div>
    <script src="settings.js"></script>
  </body>
</html>
