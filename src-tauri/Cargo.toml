[package]
name = "selection-assistant"
version = "1.1.0"
description = "Wisp - 轻量 AI 划词助手 (Tauri edition)"
authors = ["Selection Assistant"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "selection_assistant_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
